<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --accent: #FF5A1F;
    --accent-fill: rgba(255, 90, 31, 0.12);
    --r-lg: 24px; --r-md: 16px; --r-sm: 10px;
  }
  [data-theme="dark"] {
    --bg: #0f0f11; --card: #19191c; --card-2: #232327;
    --text: #f3f3f3; --muted: #8d8d94; --line: #2b2b30; --past: #5a5a61;
  }
  [data-theme="light"] {
    --bg: #ebebeb; --card: #ffffff; --card-2: #f3f3f3;
    --text: #151515; --muted: #6c6c72; --line: #e3e3e3; --past: #c6c6ca;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Urbanist, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
         padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  select.btn { appearance: none; padding-right: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 28px 0 32px; }
  .kpis.tab-totals { margin: 0 0 28px; }
  .kpi { background: var(--card); border-radius: var(--r-lg); padding: 22px 24px; }
  .kpi .label { color: var(--muted); font-size: 14px; }
  .kpi .value { font-size: 56px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; margin-top: 8px; }
  .kpi .value small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .kpi .delta { font-size: 13px; color: var(--accent); margin-top: 10px; min-height: 1em; }

  .tabs { display: inline-flex; background: var(--card); border-radius: 999px; padding: 5px; gap: 4px;
          margin-bottom: 24px; flex-wrap: wrap; }
  .tab { border: 0; background: transparent; color: var(--muted); padding: 10px 20px;
         border-radius: 999px; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; }

  .section-title { font-size: 18px; font-weight: 600; margin: 32px 0 12px; }
  .section-title span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { background: var(--card); border-radius: var(--r-md); padding: 16px 18px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .tile .value small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .chart-card { background: var(--card); border-radius: var(--r-lg); padding: 18px 18px 8px; }
  .chart-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .chart-card .chart { height: 260px; }
  .chart-card.wide { margin-bottom: 16px; }
  .chart-card.wide .chart { height: 320px; }

  .download-row { margin-top: 28px; display: flex; justify-content: flex-end; }
  .empty { background: var(--card); border-radius: var(--r-lg); padding: 40px; color: var(--muted); text-align: center; }

  .coach { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; align-items: start; }
  .panel { background: var(--card); border-radius: var(--r-lg); padding: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input, .field textarea { background: var(--card-2); border: 1px solid var(--line);
         border-radius: var(--r-sm); padding: 10px 12px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progress { margin: 14px 0 4px; }
  .progress .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .progress .bar { height: 8px; background: var(--card-2); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  #messages { height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 88%; line-height: 1.5; font-size: 14px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.model { background: var(--card-2); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.model ul { margin: 6px 0; padding-left: 18px; }
  .msg.pending { color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .chip { background: var(--card-2); border: 1px solid var(--line); border-radius: 999px;
          padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; background: var(--card-2); border: 1px solid var(--line);
                     border-radius: 999px; padding: 11px 16px; }

  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line);
           border-radius: var(--r-lg); padding: 24px; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog p.note { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px;
           font-size: 14px; max-width: 90vw; display: none; z-index: 10; }

  .status-card { background: var(--card); border-radius: var(--r-lg); padding: 24px; display: grid;
                 grid-template-columns: auto 1fr; gap: 24px; align-items: center; margin-bottom: 24px; }
  .status-card .phrase { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .status-card .subtle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status-card .side-metrics { display: grid; grid-template-columns: repeat(3, auto); gap: 24px; justify-content: end; }
  .status-card .side-metrics .m-val { font-size: 18px; font-weight: 600; }
  .status-card .side-metrics .m-lbl { color: var(--muted); font-size: 12px; }
  .status-bar { grid-column: 1 / -1; height: 10px; border-radius: 999px; overflow: hidden; display: flex; }
  .status-bar i { height: 100%; }
  .status-bar-caption { grid-column: 1 / -1; display: flex; justify-content: space-between;
                        color: var(--muted); font-size: 12px; margin-top: -8px; }

  @media (max-width: 860px) {
    .status-card { grid-template-columns: 1fr; }
    .status-card .side-metrics { grid-template-columns: repeat(3, 1fr); justify-content: stretch; }
  }
  @media (max-width: 860px) {
    .kpis, .grid-3, .coach { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .kpi .value { font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

  #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 50;
                 display: flex; align-items: center; justify-content: center; }
  #lock-card { background: var(--card); border-radius: var(--r-lg); padding: 32px; width: min(340px, 90vw); text-align: center; }
  #lock-card h2 { margin: 0 0 4px; font-size: 20px; }
  #lock-card p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  #lock-card input { width: 100%; background: var(--card-2); border: 1px solid var(--line);
                      border-radius: var(--r-sm); padding: 11px 14px; text-align: center; margin-bottom: 10px; }
  #lock-card .btn { width: 100%; justify-content: center; }
  #lock-error { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>

<div id="lock-screen">
  <div id="lock-card">
    <h2 data-i18n="lockTitle"></h2>
    <p data-i18n="lockHint"></p>
    <input id="lock-input" type="password" autocomplete="off">
    <button class="btn primary" id="lock-submit" data-i18n="lockEnter"></button>
    <div id="lock-error"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 id="athlete">—</h1>
      <p id="synced"></p>
    </div>
    <div class="tools">
      <button class="btn primary" id="btn-sync" data-i18n="refresh"></button>
      <select class="btn" id="lang" aria-label="Language">
        <option value="es">ES</option><option value="en">EN</option><option value="it">IT</option>
      </select>
      <button class="btn" id="btn-theme" aria-label="Theme">◐</button>
      <button class="btn" id="btn-settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cycling" data-i18n="cycling"></button>
    <button class="tab" role="tab" data-tab="running" data-i18n="running"></button>
    <button class="tab" role="tab" data-tab="all" data-i18n="all"></button>
    <button class="tab" role="tab" data-tab="training" data-i18n="trainingTab"></button>
    <button class="tab" role="tab" data-tab="health" data-i18n="healthTab"></button>
    <button class="tab" role="tab" data-tab="coach" data-i18n="coach"></button>
  </nav>

  <main id="panel-sport"></main>
  <main id="panel-training" hidden></main>
  <main id="panel-health" hidden></main>

  <main id="panel-coach" hidden>
    <div class="coach">
      <div class="panel">
        <h2 data-i18n="raceGoal"></h2>
        <div class="row-2">
          <div class="field"><label for="g-race-sport" data-i18n="raceSport"></label>
            <select id="g-race-sport">
              <option value="">—</option>
              <option value="cycling" data-i18n="cycling"></option>
              <option value="running" data-i18n="running"></option>
            </select>
          </div>
          <div class="field"><label for="g-race-date" data-i18n="raceDate"></label><input id="g-race-date" type="date"></div>
          <div class="field"><label for="g-race-km" data-i18n="raceDistance"></label><input id="g-race-km" type="number" min="0" step="0.1"></div>
          <div class="field"><label for="g-race-elev" data-i18n="raceElev"></label><input id="g-race-elev" type="number" min="0"></div>
          <div class="field"><label for="g-race-time" data-i18n="raceTime"></label><input id="g-race-time" type="text" placeholder="hh:mm"></div>
        </div>
        <div class="field"><label for="g-notes" data-i18n="goalNotes"></label><textarea id="g-notes"></textarea></div>

        <button class="btn primary" id="btn-goals" data-i18n="saveGoals"></button>
      </div>
      <div class="panel">
        <h2 data-i18n="coach"></h2>
        <div id="messages"></div>
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <input id="chat-input" type="text">
          <button class="btn primary" id="btn-send" data-i18n="send"></button>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog id="settings">
  <h2 data-i18n="settings" style="margin:0 0 4px;font-size:20px"></h2>
  <p class="note" data-i18n="storedLocal"></p>
  <div class="field"><label for="s-provider" data-i18n="provider"></label>
    <select id="s-provider"><option value="gemini">Gemini</option><option value="groq">Groq</option></select>
  </div>
  <div class="field"><label for="s-key" id="s-key-label"></label><input id="s-key" type="password" autocomplete="off"></div>
  <div class="field"><label for="s-model" id="s-model-label"></label><input id="s-model" type="text"></div>
  <p class="note" id="s-provider-note" style="margin-top:-6px"></p>
  <div class="field"><label for="s-gh" data-i18n="ghToken"></label><input id="s-gh" type="password" autocomplete="off"></div>
  <div class="dialog-actions">
    <button class="btn" id="s-close" data-i18n="close"></button>
    <button class="btn primary" id="s-save" data-i18n="save"></button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const state = {
  data: null, acts: [],
  tab: "cycling",
  lang: store.get("lang", "es"),
  theme: store.get("theme", "dark"),
  chat: [],
};
const $ = (id) => document.getElementById(id);
const t = (k, vars = {}) => {
  let s = (I18N[state.lang] || I18N.es)[k] ?? I18N.es[k] ?? k;
  if (typeof s === "string") for (const [a, b] of Object.entries(vars)) s = s.replace(`{${a}}`, b);
  return s;
};
const today = new Date();
const CY = today.getFullYear();
const fmt = (v, dec = 0) =>
  v == null || isNaN(v) ? "—" : Number(v).toLocaleString(t("locale"), { minimumFractionDigits: dec, maximumFractionDigits: dec });
const doy = (d) => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 1)) / 864e5) + 1;
const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const escapeHtml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function sportOf(type) {
  if (/cycl|bik|ride|bmx/.test(type)) return "cycling";
  if (/run/.test(type)) return "running";
  return "other";
}
function listFor(tab) { return tab === "all" ? state.acts : state.acts.filter((a) => a.sport === tab); }
function sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }
function hm(hours) {
  const m = Math.round(hours * 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
}
function pace(a) {
  if (!a.km || !a.h) return "—";
  const secPerKm = (a.h * 3600) / a.km;
  return `${Math.floor(secPerKm / 60)}:${String(Math.round(secPerKm % 60)).padStart(2, "0")}`;
}
function toast(msg, ms = 4500) {
  const el = $("toast"); el.textContent = msg; el.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => (el.style.display = "none"), ms);
}
function colors() {
  const cs = getComputedStyle(document.documentElement);
  const g = (v) => cs.getPropertyValue(v).trim();
  return { accent: g("--accent"), accentFill: g("--accent-fill"), text: g("--text"), muted: g("--muted"),
           line: g("--line"), past: g("--past"), card: g("--card"), card2: g("--card-2") };
}

// Datos

function parseDateField(rows) {
  return (rows || []).map((r) => ({ ...r, dateObj: new Date(r.d) }));
}
async function loadData() {
  const [actRes, wellRes] = await Promise.all([
    fetch("data/activities.json", { cache: "no-store" }),
    fetch("data/wellness.json", { cache: "no-store" }).catch(() => null),
  ]);
  if (!actRes.ok) throw new Error(actRes.status);
  const j = await actRes.json();
  state.data = j;
  state.acts = j.activities
    .map((a) => {
      const [y, m, d] = a.d.split("-").map(Number);
      return { ...a, date: new Date(y, m - 1, d), year: y, sport: sportOf(a.t) };
    })
    .sort((a, b) => a.date - b.date);

  state.wellness = null;
  if (wellRes && wellRes.ok) {
    try { state.wellness = await wellRes.json(); } catch { state.wellness = null; }
  }
}

const METRIC_DEFS = {
  acts: { labelKey: "kpiActs", unit: "", get: (l) => l.length },
  km: { labelKey: "kpiKm", unit: "km", get: (l) => sum(l, "km") },
  elev: { labelKey: "kpiElev", unit: "m", get: (l) => sum(l, "elev") },
  h: { labelKey: "kpiHours", unit: "h", get: (l) => sum(l, "h") },
};
function totalsCardsHtml(list, keys) {
  const todayDoy = doy(today);
  const cur = list.filter((a) => a.year === CY);
  const prev = list.filter((a) => a.year === CY - 1 && doy(a.date) <= todayDoy);
  const havePrev = list.some((a) => a.year === CY - 1);
  return keys.map((key) => {
    const def = METRIC_DEFS[key];
    const v = def.get(cur), p = def.get(prev);
    const diff = v - p;
    const delta = havePrev
      ? t("vsLast", { v: `${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))}${def.unit ? " " + def.unit : ""}`, y: CY - 1 })
      : "";
    return `<div class="kpi"><div class="label">${t(def.labelKey, { y: CY })}</div>
      <div class="value">${fmt(v)}${def.unit ? `<small>${def.unit}</small>` : ""}</div>
      <div class="delta">${delta}</div></div>`;
  }).join("");
}
function renderKpis() {
  $("kpis").innerHTML = totalsCardsHtml(state.acts, ["acts", "h"]);
}

    { l: t("time"), v: hm(last.h) },

    { l: t("distance"), v: fmt(last.km, 1), u: "km" },
    { l: t("elevation"), v: fmt(last.elev), u: "m" },
    isCycling
      ? { l: t("power"), v: last.pw ? fmt(last.pw) : "—", u: last.pw ? "W" : "" }
      : isRunning

  const years = yearRange(list);

    ).join("")}</div>

    <h2 class="section-title">${t("perYear")}<span>${t("avgNote")}</span></h2>
    <div class="grid-3">
      <div class="chart-card"><h3>${t("kmYear")}</h3><div class="chart" id="bar-km"></div></div>
      <div class="chart-card"><h3>${t("elevYear")}</h3><div class="chart" id="bar-elev"></div></div>
      <div class="chart-card"><h3>${t("hoursYear")}</h3><div class="chart" id="bar-h"></div></div>
    </div>
    ${isCycling ? `<div class="chart-card wide" style="margin-top:16px"><h3>${t("avgPowerMonth")}</h3><div class="chart" id="bar-pw"></div></div>` : ""}

    <h2 class="section-title">${t("progression")}</h2>
    <div class="chart-card wide"><h3>${t("kmYear")}</h3><div class="chart" id="cum-km"></div></div>
    <div class="chart-card wide"><h3>${t("elevYear")}</h3><div class="chart" id="cum-elev"></div></div>
    <div class="chart-card wide"><h3>${t("hoursYear")}</h3><div class="chart" id="cum-h"></div></div>

    ${wellnessSections}

    <div class="download-row"><button class="btn" id="btn-csv">⬇ ${t("download")}</button></div>`;

  barChart("bar-km", years, list, "km", "km", 0);
  barChart("bar-elev", years, list, "elev", "m", 0);
  barChart("bar-h", years, list, "h", "h", 0);
  cumChart("cum-km", years, list, "km", "km", 0);
  cumChart("cum-elev", years, list, "elev", "m", 0);
  cumChart("cum-h", years, list, "h", "h", 1);

  if (isCycling) monthlyPowerBarChart("bar-pw", list);
  if (isCycling || isRunning) {
    vo2maxChart("vo2-chart", isCycling ? "bike" : "run");
    if (isCycling) ftpChart("ftp-chart");
  }

  $("btn-csv").onclick = () => downloadCSV(list, `garmin_${tab}_${today.toISOString().slice(0, 10)}.csv`);
}

function monthlyPowerBarChart(el, list) {
  const c = colors();
  const months12 = Array.from({ length: 12 }, (_, i) => {
    const d = new Date(CY, today.getMonth() - 11 + i, 1);
    return { year: d.getFullYear(), month: d.getMonth() + 1, label: `${t("months")[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` };
  });
  const avgOf = (rows, key) => rows.length ? rows.reduce((s, a) => s + a[key], 0) / rows.length : null;
  const avgPw = months12.map((m) => avgOf(list.filter((a) => a.year === m.year && a.date.getMonth() + 1 === m.month && a.pw), "pw"));
  const avgNp = months12.map((m) => avgOf(list.filter((a) => a.year === m.year && a.date.getMonth() + 1 === m.month && a.np), "np"));

  const layout = baseLayout();
  layout.xaxis.type = "category";
  layout.barmode = "group";
  layout.showlegend = true;
  layout.legend = { orientation: "h", y: -0.18, font: { color: c.muted, size: 11 } };
  Plotly.react(el, [
    { type: "bar", x: months12.map((m) => m.label), y: avgPw, name: t("avgPower"),
      marker: { color: c.past, cornerradius: 8 }, hovertemplate: "<b>%{x}</b><br>%{y:.0f} W<extra></extra>" },
    { type: "bar", x: months12.map((m) => m.label), y: avgNp, name: t("normPower"),
      marker: { color: c.accent, cornerradius: 8 }, hovertemplate: "<b>%{x}</b><br>%{y:.0f} W<extra></extra>" },
  ], layout, plotConfig);
}

function yearRange(list) {
  const first = list[0].year;
  return Array.from({ length: CY - first + 1 }, (_, i) => first + i);
}

function baseLayout() {
  const c = colors();
  return {
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: "Urbanist, sans-serif", color: c.muted, size: 12 },
    margin: { l: 48, r: 14, t: 16, b: 32 },
    xaxis: { showgrid: false, zeroline: false, linecolor: c.line, fixedrange: true },
    yaxis: { gridcolor: c.line, zeroline: false, fixedrange: true, rangemode: "tozero" },
    hoverlabel: { bgcolor: c.card2, bordercolor: c.accent, font: { color: c.text, family: "Urbanist, sans-serif", size: 13 } },
    showlegend: false, bargap: 0.38,
  };
}
const plotConfig = { displayModeBar: false, responsive: true };

function barChart(el, years, list, key, unit, dec) {
  const c = colors();
  const totals = years.map((y) => sum(list.filter((a) => a.year === y), key));
  const complete = totals.filter((_, i) => years[i] !== CY);
  const avg = complete.length ? complete.reduce((a, b) => a + b, 0) / complete.length : null;

  const layout = baseLayout();
  layout.xaxis.type = "category";
  if (avg !== null) {
    layout.shapes = [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: avg, y1: avg,
                       line: { color: c.text, width: 1.5, dash: "dot" } }];
    layout.annotations = [{ xref: "paper", x: 0, y: avg, xanchor: "left", yanchor: "bottom", showarrow: false,
                            text: `${t("avg")} ${fmt(avg, dec)} ${unit}`, font: { size: 11, color: c.text } }];
  }
  Plotly.react(el, [{
    type: "bar", x: years.map(String), y: totals,
    marker: { color: years.map((y) => (y === CY ? c.accent : c.past)), cornerradius: 8 },
    hovertemplate: `<b>%{x}</b><br>%{y:,.${dec}f} ${unit}<extra></extra>`,
  }], layout, plotConfig);
}

function cumChart(el, years, list, key, unit, dec) {
  const c = colors();
  const months = t("months");
  const traces = [], ends = [];
  years.forEach((y, idx) => {
    const daily = new Array(368).fill(0);
    list.filter((a) => a.year === y).forEach((a) => (daily[doy(a.date)] += a[key] || 0));
    const len = y === CY ? doy(today) : isLeap(y) ? 366 : 365;
    const xs = [], ys = [], cd = [];
    let s = 0;
    for (let d = 1; d <= len; d++) {
      s += daily[d];
      const dt = new Date(y, 0, d);
      xs.push(d); ys.push(s); cd.push(`${dt.getDate()} ${months[dt.getMonth()]} ${y}`);
    }
    const isCur = y === CY;
    const age = years.length - 1 - idx;
    traces.push({
      type: "scatter", mode: "lines", x: xs, y: ys, customdata: cd, name: String(y),
      line: { color: isCur ? c.accent : c.past, width: isCur ? 3 : 1.6 },
      opacity: isCur ? 1 : Math.max(0.35, 1 - age * 0.18),
      fill: isCur ? "tozeroy" : "none", fillcolor: c.accentFill,
      hovertemplate: `%{customdata}<br><b>%{y:,.${dec}f} ${unit}</b><extra></extra>`,
    });
    ends.push({ x: len, y: s, text: String(y), color: isCur ? c.accent : c.muted });
  });
  // años pasados primero, año actual encima
  traces.push(traces.splice(traces.length - 1, 1)[0]);

  const layout = baseLayout();
  layout.margin.r = 48;
  const monthStarts = Array.from({ length: 12 }, (_, m) => doy(new Date(2001, m, 1)));
  layout.xaxis = { ...layout.xaxis, range: [1, 372], tickvals: monthStarts, ticktext: months };
  layout.annotations = ends.map((e) => ({ x: e.x, y: e.y, text: e.text, xanchor: "left", showarrow: false,
                                          xshift: 4, font: { size: 11, color: e.color } }));
  layout.hovermode = "closest";
  Plotly.react(el, traces, layout, plotConfig);
}

function wellnessLineFig(el, points, yKey, color, unit, dec = 0) {
  const pts = (points || []).filter((p) => p[yKey] != null);
  const layout = baseLayout();
  layout.xaxis = { ...layout.xaxis, type: "date" };
  if (!pts.length) { Plotly.react(el, [], layout, plotConfig); return; }
  Plotly.react(el, [{
    type: "scatter", mode: "lines+markers", x: pts.map((p) => p.d), y: pts.map((p) => p[yKey]),
    line: { color, width: 2.5 }, marker: { size: 4, color },
    hovertemplate: `%{x}<br><b>%{y:.${dec}f} ${unit}</b><extra></extra>`,
  }], layout, plotConfig);
}
function vo2maxChart(el, key) {
  wellnessLineFig(el, state.wellness?.vo2max, key, colors().accent, "ml/kg/min", 1);
}
function ftpChart(el) {
  wellnessLineFig(el, state.wellness?.ftp, "ftp", colors().accent, "W", 0);
}

const STATUS_COLORS = {
  PRODUCTIVE: "#6BCB77", PEAKING: "#4D96FF", MAINTAINING: "#FFA630", BALANCED: "#FFA630",
  OVERREACHING: "#FF6B6B", RECOVERY: "#FFD93D", DETRAINING: "#FF924C", UNPRODUCTIVE: "#FF6B6B",
  NO_STATUS: "#6b7280",
};
function statusColor(phrase) {
  return STATUS_COLORS[(phrase || "").toUpperCase().replace(/\s+/g, "_")] || "#6b7280";
}
function statusLabel(phrase) {
  if (!phrase) return "—";
  return phrase.charAt(0) + phrase.slice(1).toLowerCase().replace(/_/g, " ");
}

function downloadCSV(list, filename) {
  const head = ["date", "sport", "type", "name", "distance_km", "elevation_m", "duration_h", "avg_hr", "avg_speed_kmh"];
  const esc = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = list.map((a) => [a.d, a.sport, a.t, a.n, a.km, a.elev, a.h, a.hr, a.spd].map(esc).join(","));
  const blob = new Blob(["\ufeff" + head.join(",") + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function activitiesCsv() {
  const rows = state.acts.map((a) =>
    [a.d, a.sport, a.t, a.km, a.elev, a.h, a.hr ?? "", a.spd ?? ""].join(","));
  return "date,sport,type,km,elev_m,hours,avg_hr,avg_kmh\n" + rows.join("\n");
}
function wellnessSummaryForPrompt() {
  const w = state.wellness;
  if (!w) return "No wellness/training-status data available yet.";
  const last = (arr) => (arr && arr.length ? arr[arr.length - 1] : null);
  const avg = (arr, key) => {
    const vals = (arr || []).map((p) => p[key]).filter((v) => v != null);
    return vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : null;
  };
  const ts = w.training_status || {};
  const lastVo2 = last(w.vo2max) || {};
  const lastFtp = last(w.ftp) || {};
  return [
    `Training status: ${ts.phrase || "n/a"} (load focus: ${ts.loadFocus || "n/a"}, HRV status: ${ts.hrvStatus || "n/a"})`,
    `VO2max category: ${w.vo2max_category || "n/a"}. Latest VO2max — running: ${lastVo2.run ?? "n/a"}, cycling: ${lastVo2.bike ?? "n/a"}.`,
    `Latest cycling FTP: ${lastFtp.ftp ?? "n/a"} W (as of ${lastFtp.d ?? "n/a"}).`,
    `Average sleep (recent period): ${avg(w.sleep, "h") ?? "n/a"} h/night.`,
    `Average weekly steps: ${avg(w.steps_weekly, "steps") ?? "n/a"}.`,
    `Average weekly stress level: ${avg(w.stress_weekly, "stress") ?? "n/a"}.`,
  ].join("\n");
}
function systemPrompt() {
  const goals = getGoals();
  const race = {
    sport: goals.raceSport || null, date: goals.raceDate || null,
    distance_km: goals.raceKm || null, elevation_m: goals.raceElev || null,
    target_time: goals.raceTime || null,
  };
  const hasRace = race.sport || race.date || race.distance_km || race.elevation_m || race.target_time;
  return [
    `You are an experienced endurance coach (cycling and running). Answer in ${t("answerLang")}.`,
    `Be concise and concrete: short paragraphs or short bullet lists, use the athlete's real numbers.`,
    `Today is ${today.toISOString().slice(0, 10)}. Athlete: ${state.data?.athlete || "unknown"}.`,
    hasRace
      ? `Specific upcoming race target (any blank field means the athlete left it open — don't assume a value for it): ${JSON.stringify(race)}`
      : `No specific race target has been set yet.`,
    goals.notes ? `Athlete's own notes for the coach: ${goals.notes}` : `No extra notes from the athlete.`,
    `Wellness and training-status summary:\n${wellnessSummaryForPrompt()}`,
    `Complete activity history (CSV):\n${activitiesCsv()}`,
    `Whenever you give a training plan (a set of workouts across days/weeks), always lay it out as a clear day-by-day or week-by-week structure (markdown table or list) so it can be read as a standalone plan — the UI lets the athlete download your reply as a file, so make the plan self-contained and well formatted.`,
  ].join("\n\n");
}
function md(text) {
  const lines = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.*)/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    html += line.trim() ? `<p style="margin:4px 0">${line}</p>` : "";
  }
  return html + (inList ? "</ul>" : "");
}
function addMsg(role, html, pending = false) {
  const div = document.createElement("div");
  div.className = `msg ${role}${pending ? " pending" : ""}`;
  div.innerHTML = html;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}
function addDownloadLink(div, plainText) {
  const a = document.createElement("a");
  a.href = "#";
  a.className = "chip";
  a.style.cssText = "display:inline-block;margin-top:8px;text-decoration:none;";
  a.textContent = `⬇ ${t("downloadPlan")}`;
  a.onclick = (e) => {
    e.preventDefault();
    const blob = new Blob([plainText], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `coach_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.txt`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  div.appendChild(a);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function callWithRetry(fetchOnce, pending) {
  const delays = [0, 2000, 5000]; // 3 intentos: inmediato, +2s, +5s
  let lastErr;
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) {
      pending.textContent = `${t("thinking")} (${t("retrying")})`;
      await sleep(delays[i]);
    }
    const res = await fetchOnce();
    if (res.ok) return res.json();
    const text = await res.text();
    lastErr = new Error(`HTTP ${res.status}: ${text}`);
    if (res.status !== 503 && res.status !== 429) throw lastErr; // solo reintenta en saturación/rate-limit temporal
  }
  throw lastErr;
}

function callGemini(model, key, pending) {
  return callWithRetry(() => fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
    { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: systemPrompt() }] }, contents: state.chat }) },
  ), pending).then((data) => data?.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "—");
}

function callGroq(model, key, pending) {
  const messages = [
    { role: "system", content: systemPrompt() },
    ...state.chat.map((m) => ({ role: m.role === "model" ? "assistant" : "user", content: m.parts[0].text })),
  ];
  return callWithRetry(() => fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
    body: JSON.stringify({ model, messages }),
  }), pending).then((data) => data?.choices?.[0]?.message?.content || "—");
}

async function ask(text) {
  text = text.trim();
  if (!text) return;
  const provider = store.get("provider", "groq");
  const key = store.get(`${provider}_key`, "");
  if (!key) { openSettings(); toast(t("needKey")); return; }
  const model = store.get(`${provider}_model`, "") || DEFAULT_MODELS[provider];

  $("chat-input").value = "";
  $("btn-send").disabled = true;
  addMsg("user", escapeHtml(text));
  state.chat.push({ role: "user", parts: [{ text }] });
  const pending = addMsg("model", t("thinking"), true);

  try {
    const reply = provider === "groq" ? await callGroq(model, key, pending) : await callGemini(model, key, pending);
    pending.classList.remove("pending");
    pending.innerHTML = md(reply);
    addDownloadLink(pending, reply);
    state.chat.push({ role: "model", parts: [{ text: reply }] });
  } catch (e) {
    console.error(e);
    state.chat.pop();
    pending.classList.remove("pending");
    pending.textContent = (e.message.includes("503") || e.message.includes("429")) ? t("geminiBusy") : t("geminiError");
  } finally {
    $("btn-send").disabled = false;
    $("chat-input").focus();
  }
}
function renderChips() {
  $("chips").innerHTML = "";
  t("chips").forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.onclick = () => ask(c);

// ---------------------------------------------------------------------------
// Actualizar datos (dispara GitHub Actions)
// ---------------------------------------------------------------------------
function ghHeaders(token) {
  return { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "X-GitHub-Api-Version": "2022-11-28" };
}
async function triggerSync() {
  const token = store.get("gh_token", "");
  if (!token) { openSettings(); toast(t("needToken")); return; }
  const base = `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/actions/workflows/${REPO.workflow}`;
  $("btn-sync").disabled = true;
  try {
    const started = Date.now();
    const res = await fetch(`${base}/dispatches`, {
      method: "POST", headers: ghHeaders(token),
      body: JSON.stringify({ ref: REPO.ref, inputs: { scope: "activities" } }),
    });
    if (res.status !== 204) throw new Error(res.status);
    toast(t("syncStarted"), 8000);
    pollRun(base, token, started);
  } catch (e) {
    toast(`${t("syncError")} (${e.message})`);
    $("btn-sync").disabled = false;
  }
}
function pollRun(base, token, started) {
  const check = async () => {
    try {
      const res = await fetch(`${base}/runs?per_page=1&event=workflow_dispatch`, { headers: ghHeaders(token) });
      const run = (await res.json()).workflow_runs?.[0];
      if (run && new Date(run.created_at).getTime() >= started - 60000 && run.status === "completed") {
        $("btn-sync").disabled = false;
        if (run.conclusion === "success") { toast(t("syncDone"), 60000); setTimeout(() => location.reload(), 60000); }
        else toast(t("syncFailed"), 10000);
        return;
      }
    } catch {}
    if (Date.now() - started < 15 * 60000) setTimeout(check, 15000);
    else $("btn-sync").disabled = false;
  };
  setTimeout(check, 15000);
}

// ---------------------------------------------------------------------------
// Candado de acceso (casual — ver nota en PASSWORD_HASH)
// ---------------------------------------------------------------------------
// Hash SHA-256 de la contraseña. Para generarlo SIN escribir tu contraseña
// en ningún archivo ni chat: abre la consola del navegador (F12) en
// cualquier página y corre:
//   crypto.subtle.digest("SHA-256", new TextEncoder().encode("tu_password"))
//     .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("")))
// Copia el resultado aquí abajo. Vacío = candado desactivado.
const PASSWORD_HASH = "95c41b7899585516267fdb045910ba4a178a518d759db56b1b9648808d295922";

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function startApp() {
  applyStaticText();
  fillGoals();
  showTab("cycling");
  try {
    await loadData();
    renderAll();
  } catch {
    $("panel-sport").innerHTML = `<div class="empty">${t("loadError")}</div>`;
  }
}
async function tryUnlock() {
  const input = $("lock-input").value;
  if ((await sha256Hex(input)) === PASSWORD_HASH) {
    store.set("unlocked", PASSWORD_HASH);
    $("lock-screen").remove();
    startApp();
  } else {
    $("lock-error").textContent = t("lockWrong");
  }
}
document.documentElement.dataset.theme = state.theme;
applyStaticText(); // para que el candado ya muestre el idioma guardado
if (!PASSWORD_HASH || store.get("unlocked", "") === PASSWORD_HASH) {
  $("lock-screen")?.remove();
  startApp();
} else {
  $("lock-submit").onclick = tryUnlock;
  $("lock-input").addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  $("lock-input").focus();
}
